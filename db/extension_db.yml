#########################################################################
# Extension Database
#########################################################################
#
# Server-side toggles for behaviour that deviates from stock rAthena.
# Each entry gates a specific code path elsewhere in the server;
# disabling an extension restores the stock behaviour.
#
# Every entry is off by default. To enable one on this server, do NOT
# edit this file -- copy the Id into db/import/extension_db.yml with
# Enabled: true and it will be picked up on the next reload. Mods do
# the same through their own db/ folder.
#
#########################################################################
# - Id            Stable identifier the C code and script commands use.
#                 Snake_case, lowercase, short.
#   Name          One-line human-readable label (shown by @extensions).
#   Description   Multi-line explanation (shown by @extensioninfo).
#   Enabled       true / false. Defaults to false. Overrides in
#                 db/import/extension_db.yml only need Id and Enabled.
#   Values        Optional. Typed settings the extension's code reads,
#                 so a mod can tune a number or name something without
#                 a new C++ change. Each entry has a Key and either
#                 declares it (here, in the base file):
#                   Type          Int or String.
#                   Default       Used while the extension is on and
#                                 nothing sets Value. Default 0 / "".
#                   Min, Max      Int only, optional. A Value outside
#                                 them is capped, with a warning.
#                   Description   Shown by @extensioninfo.
#                 or sets it (in an import, or a mod's db/ folder):
#                   Value         The number or string to use.
#                 Keys merge one at a time, so two mods setting different
#                 keys of one extension both apply; for the same key, the
#                 later file wins.
#
#                 While an extension is off, its code sees the stock value:
#                 C++ reads extension_int(id, key, stock) and
#                 extension_string(id, key, stock); scripts read
#                 getextensionvalue("<id>", "<key>"{, <stock>}).
#                 getextension("<id>") returns 1 when it is on.
#
#                 Example:
#                   - Id: example_rate
#                     Name: Example
#                     Values:
#                       - Key: rate
#                         Type: Int
#                         Default: 100
#                         Min: 0
#                         Max: 1000
#                 and, to turn it on at 150:
#                   - Id: example_rate
#                     Enabled: true
#                     Values:
#                       - Key: rate
#                         Value: 150
#########################################################################

Header:
  Type: EXTENSION_DB
  Version: 1

Body:
  - Id: pc_drop_item_event
    Name: Fire OnPCDropItemEvent per monster drop
    Description: |
      When a monster's regular drop table rolls a drop for a player, fire
      an NPCE_DROPITEM script event on that player before the flooritem
      is placed on the map. The event's script label is OnPCDropItemEvent
      and the following player parameters are set for the duration of the
      handler:

        killedgid     the mob's unique unit id
        killedrid     the mob's mob_db id (its class id)
        killeddropid  the item id that was rolled
        killedbyme    1 if the drop recipient (this pc) also dealt the
                      killing blow; 0 if a party mate, merc, homun, or
                      someone else got the kill

      Fires once per successful drop -- a mob that drops three items in
      one death fires it three times, once per item. Off means stock
      rAthena: no such event exists.

  - Id: blaze_shield_knockback
    Name: "Blaze Shield pin on entry"
    Description: |
      Make NJ_KAENSIN (Blaze Shield / Blazing Field) pillars hit the
      moment a mob walks onto them, and pin the mob there until the
      pillar's full stack of hits burns out.
      Stock KAENSIN only damages via the 100 ms global skill_unit_timer:
      a mob fast enough to cross a cell between global ticks skips it,
      so most pillars in the 5x5 donut never see the mob. With this on,
      walking onto a pillar fires the hit immediately (no cell can be
      skipped, regardless of mob walkspeed) and applies a skill-induced
      walkdelay of val2 * interval ms, so the mob stays on the pillar
      until it burns out, then moves to the next one.
      Endure (SC_ENDURE) and MD_STATUSIMMUNE skip the pin -- an endure
      mob still eats the entry hit but can keep walking, matching the
      stock escape hatch for firewall-family cells.
      Off by default; stock behaviour is unchanged.
    Enabled: false

  - Id: map_mob_count_rate
    Name: Per-map monster counts (setmapmobcountrate)
    Description: |
      Lets a script scale how many monsters each spawn line on one map puts
      out, with setmapmobcountrate "<map>",<rate> -- a percent of what the
      line asks for after the global mob_count_rate, so the two multiply.
      200 doubles a map, 50 halves it, 100 puts it back. A line of a single
      monster stays single, as with mob_count_rate, so a map's boss is not
      doubled along with its field. Monsters that are out are added or
      removed at once; a map that spawns on entry (dynamic_mobs) uses the
      new count the next time it does. Rates last until the scripts are
      reloaded, so set them in OnInit.
      Off is stock rAthena: setmapmobcountrate warns and does nothing.
    Enabled: false
    Values:
      - Key: max_rate
        Type: Int
        Default: 1000
        Min: 100
        Max: 10000
        Description: Highest rate a script may set, in percent.

  - Id: attendance_repeat
    Name: Attendance rewards start over after the last day
    Description: |
      Once a player has claimed every day of the running attendance period
      (db/attendance.yml), the next day's claim starts again at day 1, so
      one long period gives its rewards in a repeating cycle. The counter
      goes back to 0 when the player logs in, opens the Attendance Check
      window or claims, and only on a day nothing was claimed yet.
      Off is stock rAthena: after the last day nothing more is given until
      a new period starts.
    Enabled: false

  - Id: attendance_script_rewards
    Name: Scripts can change attendance rewards (setattendancereward)
    Description: |
      Lets a script change the reward of one day of the running attendance
      period (db/attendance.yml) with setattendancereward <day>,<item id>,
      <amount>, so a mod can take the rewards from its settings. An unknown
      item ID or an amount out of range is refused with a warning and the
      day keeps its reward. Changes last until db/attendance.yml is read
      again (server start or @reloadattendancedb), so set them in OnInit.
      The client still shows its own System/CheckAttendance.lub;
      getattendancereward reads the rewards back, e.g. for a client plugin.
      Off is stock rAthena: setattendancereward warns and does nothing.
    Enabled: false

  - Id: stylist_script_costs
    Name: Scripts can set the stylist window's costs (setstylistcost)
    Description: |
      Lets a script set the cost of every option of one look in the stylist
      window (openstylist, @stylist) with setstylistcost <look>,<zeny>
      {,<item id>{,<item box id>}}, for humans and Doram alike, so a mod can
      take the prices from its settings. The options stay stylist.yml's.
      The player pays the Zeny or the item (a coupon), as
      setstylistpayment <mode> says (0 Zeny, the default, 1 coupons).
      Also buys an order with several changes as a whole: if anything is
      missing, nothing is charged or changed. Costs last until the scripts
      are loaded again, so set them in OnInit. Off is stock rAthena:
      setstylistcost warns and does nothing.
    Enabled: false

  - Id: channel_log
    Name: Messages in one chat channel go to the map server's log
    Description: |
      Writes each message a player sends in the chat channel named by
      Values.channel to the map server's log, one line each:
        [Info]: [channel] #discord<tab><character name><tab><message>
      so a program following the log can pass the channel on, for example to
      a Discord channel. Messages a script sends with channel_chat are not
      written, so a program that puts replies back into the channel does not
      see its own. The channel itself is made as usual, in channels.conf or
      with channel_create. Off is stock rAthena: nothing is written.
    Enabled: false
    Values:
      - Key: channel
        Type: String
        Default: "#discord"
        Description: The channel to write, with or without its #.

Footer:
  Imports:
    - Path: db/import/extension_db.yml
